<title>onkai.films</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap">
<style>
/* ---------- fontes da marca ---------- */
@font-face{font-family:"Lemon Milk";src:url("{{FONT:LEMONMILK-Light.otf}}") format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url("{{FONT:LEMONMILK-Regular.otf}}") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url("{{FONT:LEMONMILK-Bold.otf}}") format("opentype");font-weight:700;font-display:swap}

/* ---------- tokens ---------- */
:root{
  --ink:#0B0B0C;
  --ink-2:#141416;
  --ink-3:#1C1C1F;
  --bone:#EFEBE4;
  --bone-ink:#171614;
  --text:#E9E6E1;
  --dim:#8A8781;
  --sun:#E0A24A;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.22);

  /* chapa de legibilidade: usada sempre que texto branco cai sobre foto */
  --scrim-bottom:linear-gradient(180deg,rgba(11,11,12,0) 0%,rgba(11,11,12,.30) 34%,rgba(11,11,12,.74) 66%,rgba(11,11,12,.94) 100%);
  --scrim-tint:rgba(11,11,12,.22);

  --display:"Lemon Milk","Futura","Century Gothic","Trebuchet MS",sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;

  --pad:clamp(20px,5vw,64px);
  --max:1240px;

  --t-fast:.25s cubic-bezier(.2,.7,.3,1);
  --t-slow:.7s cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  font-weight:300;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:2px}

/* ---------- utilitários de tipo ---------- */
.eyebrow{
  font-family:var(--body);
  font-size:.688rem;
  font-weight:500;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--dim);
  display:flex;align-items:center;gap:.6em;
}
.eyebrow b{color:var(--sun);font-weight:500;font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{
  font-family:var(--display);
  font-weight:700;
  text-transform:uppercase;
  line-height:1.04;
  letter-spacing:-.005em;
  text-wrap:balance;
  margin:0;
}
h2{font-size:clamp(1.6rem,3.6vw,2.6rem)}
p{margin:0}
.lede{color:var(--dim);max-width:52ch;font-size:.95rem}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--pad)}
section{position:relative}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(22px);transition:opacity var(--t-slow),transform var(--t-slow)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  *{animation:none!important}
}

/* ---------- 01 navbar ---------- */
.nav{
  position:fixed;inset:0 0 auto 0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;
  padding:18px var(--pad);
  transition:background var(--t-fast),border-color var(--t-fast),padding var(--t-fast);
  border-bottom:1px solid transparent;
}
.nav.stuck{
  background:rgba(11,11,12,.86);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom-color:var(--line);
  padding-block:12px;
}
.nav .logo{height:26px;width:auto;filter:none}
.nav-links{display:flex;align-items:center;gap:30px}
.nav-links a{
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  color:var(--text);opacity:.72;position:relative;padding-block:4px;
  transition:opacity var(--t-fast);
}
.nav-links a::after{
  content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--sun);
  transition:right var(--t-fast);
}
.nav-links a:hover{opacity:1}
.nav-links a:hover::after,.nav-links a[aria-current="true"]::after{right:0}
.btn{
  display:inline-flex;align-items:center;gap:.6em;
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  padding:12px 20px;border:1px solid var(--line-strong);
  transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast),transform var(--t-fast);
}
.btn:hover{background:var(--text);color:var(--ink);border-color:var(--text)}
.btn.solid{background:var(--text);color:var(--ink);border-color:var(--text)}
.btn.solid:hover{background:transparent;color:var(--text)}
.btn .ar{transition:transform var(--t-fast)}
.btn:hover .ar{transform:translateX(4px)}
.burger{display:none;width:34px;height:34px;align-items:center;justify-content:center}
.burger span{display:block;width:20px;height:1px;background:var(--text);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:1px;background:var(--text);transition:transform var(--t-fast)}
.burger span::before{top:-6px}.burger span::after{top:6px}
body.menu .burger span{background:transparent}
body.menu .burger span::before{transform:translateY(6px) rotate(45deg)}
body.menu .burger span::after{transform:translateY(-6px) rotate(-45deg)}

.drawer{
  position:fixed;inset:0;z-index:55;background:var(--ink);
  display:flex;flex-direction:column;justify-content:center;gap:8px;
  padding:0 var(--pad);
  transform:translateY(-100%);visibility:hidden;
  transition:transform .45s cubic-bezier(.2,.7,.3,1),visibility .45s;
}
body.menu .drawer{transform:none;visibility:visible}
.drawer a{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:2rem;padding:10px 0;border-bottom:1px solid var(--line)}

/* ---------- 02 hero ---------- */
.hero{min-height:100svh;display:grid;align-items:end;overflow:hidden;background:var(--ink)}
.hero-media{position:absolute;inset:0;overflow:hidden}
.hero-media img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.14)}}
.hero-media::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(11,11,12,.80) 0%,rgba(11,11,12,.30) 30%,rgba(11,11,12,.70) 72%,var(--ink) 100%),
    linear-gradient(90deg,rgba(11,11,12,.62) 0%,rgba(11,11,12,.20) 52%,rgba(11,11,12,0) 100%),
    var(--scrim-tint);
}
.hero-in{position:relative;z-index:2;text-shadow:0 1px 24px rgba(11,11,12,.55);padding-block:0 clamp(48px,9vh,110px)}
.hero h1{font-size:clamp(2.3rem,7.2vw,5.2rem);margin-block:14px 20px}
.hero .lede{font-size:1rem;max-width:36ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.scrollcue{
  position:absolute;left:var(--pad);bottom:22px;z-index:3;
  font-size:.625rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:10px;
}
.scrollcue i{display:block;width:38px;height:1px;background:var(--line-strong);position:relative;overflow:hidden}
.scrollcue i::after{content:"";position:absolute;inset:0;background:var(--sun);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

/* ---------- 03 / 06 frases ---------- */
.statement{padding-block:clamp(70px,11vw,132px);text-align:center;background:var(--ink-2)}
.statement .disp{font-size:clamp(1.3rem,3.1vw,2.2rem);line-height:1.28;letter-spacing:.02em;font-weight:400}
.statement .disp em{font-style:normal;color:var(--dim)}
.statement .disp b{font-weight:700}

/* ---------- cabeçalho de seção ---------- */
.sechead{display:flex;flex-direction:column;gap:14px;padding-block:clamp(56px,8vw,96px) 34px}
.sechead h2{max-width:16ch}

/* ---------- 05 grid projetos ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.card{
  position:relative;display:block;overflow:hidden;background:var(--ink-2);
  aspect-ratio:16/10;
}
.card.wide{grid-column:1 / -1;aspect-ratio:21/8}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.3,1),filter var(--t-slow)}
.card::after{
  content:"";position:absolute;inset:0;
  background:var(--scrim-bottom),var(--scrim-tint);
  transition:opacity var(--t-slow);
}
.card::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,11,12,0) 52%,rgba(11,11,12,.55) 100%);
  opacity:0;transition:opacity var(--t-slow);
}
.card:hover img{transform:scale(1.06)}
.card:hover::before{opacity:1}
.card-in{
  position:absolute;z-index:2;inset:auto 0 0 0;
  padding:clamp(18px,2.6vw,30px);
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
}
.card-in h3{font-size:clamp(1.05rem,2.1vw,1.55rem)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{
  font-size:.625rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text);
  opacity:.62;border:1px solid var(--line-strong);padding:4px 9px;
}
.golink{
  display:inline-flex;align-items:center;gap:.6em;
  font-size:.688rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  color:var(--text);
  padding-bottom:3px;border-bottom:1px solid transparent;
  transition:border-color var(--t-fast),color var(--t-fast);
}
.card:hover .golink{border-bottom-color:var(--sun);color:var(--sun)}
.card:hover .golink .ar{transform:translateX(5px)}
.golink .ar{transition:transform var(--t-fast)}

/* ---------- 07 serviços ---------- */
.services{padding-bottom:clamp(60px,9vw,104px)}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-top:1px solid var(--line)}
.svc{padding:30px 26px 34px;background:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.svc:last-child{border-right:0}
.svc svg{width:26px;height:26px;stroke:var(--sun);fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.svc h3{font-size:.85rem;letter-spacing:.1em}
.svc p{color:var(--dim);font-size:.875rem}
.svc ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.svc li{font-size:.688rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.72}
.svc-lead{display:grid;gap:14px;align-content:start;padding-block:30px}

/* ---------- 08 sobre ---------- */
.about{display:grid;grid-template-columns:1fr 1fr;background:var(--ink-2)}
.about-img{position:relative;min-height:420px;overflow:hidden}
.about-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.about-img::after{content:"";position:absolute;inset:0;background:var(--scrim-tint)}
.about-txt{padding:clamp(38px,6vw,84px);display:flex;flex-direction:column;gap:20px;justify-content:center}
.about-txt h2{max-width:18ch}
.about-txt p{color:var(--dim);max-width:46ch;font-size:.938rem}

/* ---------- 09 estrutura (faixa clara) ---------- */
.structure{background:var(--bone);color:var(--bone-ink);padding-block:clamp(56px,8vw,92px)}
.structure .eyebrow{color:#6C6862}
.structure .eyebrow b{color:#A9762A}
.structure-in{display:grid;grid-template-columns:.9fr 2.1fr;gap:clamp(28px,5vw,64px);align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.stat{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(23,22,20,.18);padding-top:14px}
.stat .n{font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1}
.stat h3{font-size:.75rem;letter-spacing:.14em}
.stat p{font-size:.813rem;color:#5E5A54}

/* ---------- 10 processo ---------- */
.process{padding-block:clamp(56px,8vw,96px)}
.process-in{display:grid;grid-template-columns:.9fr 2.1fr;gap:clamp(28px,5vw,64px);align-items:start}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.step{position:relative;padding:0 18px 0 0;display:flex;flex-direction:column;gap:8px}
.step .n{
  font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--sun);
  font-variant-numeric:tabular-nums;line-height:1;
}
.step h3{font-size:.75rem;letter-spacing:.14em}
.step p{font-size:.813rem;color:var(--dim)}
.step .rail{position:absolute;top:7px;left:34px;right:8px;height:1px;background:var(--line)}
.step .rail::after{
  content:"";position:absolute;inset:0;background:var(--sun);transform-origin:left;
  transform:scaleX(0);transition:transform .8s cubic-bezier(.2,.7,.3,1);
}
.steps.in .step .rail::after{transform:scaleX(1)}
.steps.in .step:nth-child(2) .rail::after{transition-delay:.12s}
.steps.in .step:nth-child(3) .rail::after{transition-delay:.24s}
.steps.in .step:nth-child(4) .rail::after{transition-delay:.36s}
.step:last-child .rail{display:none}

/* ---------- 11 cta ---------- */
.cta{position:relative;min-height:clamp(360px,52vh,520px);display:grid;align-items:center;overflow:hidden}
.cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(11,11,12,.94) 0%,rgba(11,11,12,.86) 34%,rgba(11,11,12,.52) 68%,rgba(11,11,12,.34) 100%),
  linear-gradient(180deg,rgba(11,11,12,.42) 0%,rgba(11,11,12,0) 34%,rgba(11,11,12,.42) 100%)}
.cta-in{position:relative;z-index:2;text-shadow:0 1px 22px rgba(11,11,12,.6);display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.cta h2{font-size:clamp(1.45rem,3.2vw,2.35rem);max-width:26ch;line-height:1.1}

/* ---------- 12 formulário ---------- */
.contact{background:var(--ink-2);padding-block:clamp(56px,8vw,92px)}
.contact-in{display:grid;grid-template-columns:.9fr 2.1fr;gap:clamp(28px,5vw,64px);align-items:start}
form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.f{display:flex;flex-direction:column;gap:8px}
.f.span2{grid-column:span 2}
.f.span3{grid-column:span 3}
label{font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
input,select,textarea{
  font:inherit;font-size:.875rem;color:var(--text);
  background:transparent;border:0;border-bottom:1px solid var(--line-strong);
  padding:9px 0;border-radius:0;
  transition:border-color var(--t-fast);
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 11px) 18px,calc(100% - 6px) 18px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--ink-2);color:var(--text)}
textarea{resize:vertical;min-height:74px}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--sun)}
input::placeholder,textarea::placeholder{color:#5B5955}
.f.err input,.f.err select,.f.err textarea{border-bottom-color:#C4553F}
.msg{font-size:.688rem;color:#C4553F;min-height:1em}
.f-actions{grid-column:span 3;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sent{
  font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);
  opacity:0;transform:translateX(-6px);transition:opacity var(--t-fast),transform var(--t-fast);
}
.sent.on{opacity:1;transform:none}

/* ---------- 13 footer ---------- */
footer{padding-block:38px;border-top:1px solid var(--line);background:var(--ink)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap}
.foot .logo{height:24px}
.foot .tag-line{font-size:.75rem;color:var(--dim);margin-top:9px;line-height:1.5}
.socials{display:flex;gap:26px}
.socials a{display:inline-flex;align-items:center;gap:.6em;font-size:.688rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:color var(--t-fast)}
.socials a:hover{color:var(--text)}
.socials svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.copy{font-size:.688rem;letter-spacing:.14em;text-transform:uppercase;color:#57554F}

/* ---------- modo anotações ---------- */
.annot{
  position:fixed;right:18px;bottom:18px;z-index:70;
  display:inline-flex;align-items:center;gap:.7em;
  font-size:.688rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  padding:11px 17px;border:1px solid var(--line-strong);
  background:rgba(11,11,12,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
}
.annot:hover{border-color:var(--sun);color:var(--sun)}
.annot .dot{width:6px;height:6px;background:#4A4844;border-radius:50%;transition:background var(--t-fast)}
body.annot-on .annot .dot{background:var(--sun)}
[data-step]{position:relative}
[data-step]::before{
  content:attr(data-step);
  position:absolute;top:0;left:0;z-index:40;
  font-family:var(--body);font-size:.625rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink);background:var(--sun);
  padding:6px 11px;
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity var(--t-fast),transform var(--t-fast);
}
body.annot-on [data-step]{outline:1px dashed rgba(224,162,74,.55);outline-offset:-1px}
body.annot-on [data-step]::before{opacity:1;transform:none}

/* ---------- responsivo ---------- */
@media (max-width:1000px){
  .svc-grid{grid-template-columns:repeat(2,1fr)}
  .svc:nth-child(2){border-right:0}
  .structure-in,.process-in,.contact-in{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr;gap:22px}
  .step .rail{display:none}
  .about{grid-template-columns:1fr}
  .about-img{min-height:290px}
}
@media (max-width:720px){
  .nav-links,.nav .btn{display:none}
  .hero-in{padding-bottom:clamp(86px,15vh,130px)}
  .annot{right:12px;bottom:12px;padding:9px 13px;font-size:.625rem;letter-spacing:.12em}
  .burger{display:flex}
  .grid{grid-template-columns:1fr}
  .card,.card.wide{aspect-ratio:4/3}
  .svc-grid{grid-template-columns:1fr}
  .svc{border-right:0;border-bottom:1px solid var(--line)}
  .stats{grid-template-columns:1fr}
  form{grid-template-columns:1fr}
  .f.span2,.f.span3,.f-actions{grid-column:span 1}
  .foot{flex-direction:column;align-items:flex-start}
}
</style>
